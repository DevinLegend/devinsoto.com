name: Deploy to GitHub Pages

# Retired. GitHub Pages publishes the personal hub from master
# (.github/workflows/static.yml). A push to main must not upload this
# resume site over https://devinsoto.com. Manual runs do not deploy either.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Do not deploy
        run: echo "This workflow no longer deploys. The live site is published from master."
